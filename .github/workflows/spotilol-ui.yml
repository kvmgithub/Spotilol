# MySpotilol: Myspoti's native interface with the security scope of Spotilol and Spotilol Lite.
# Builds on every push to myspoti-ui and signs with the fork key (APK_SIGNING_BUNDLE).
# CHANGELOG-UI.md holds the version: when its newest "## [X.Y.Z] - date" section has no ui-vX.Y.Z
# release yet, the build is published as that release, marked "Latest", with the section as its text.
# Up to 0.13.1 these were pre-releases next to Spotilol Lite; from 1.0.0 on MySpotilol is the main app.
# Spotilol Lite's update check (releases/latest) reads the tag "ui-v..." as no newer version.
# The notes job keeps the text of every published release in step with its section.
# A run dispatched on a work branch builds and checks the same way and never publishes: its APK,
# checksum, test reports and, on failure, its log are kept as artifacts of the run instead.
name: MySpotilol
on:
  push:
    branches: [myspoti-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spotilol-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository_owner == 'kvmgithub'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: base
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Version, and publish or build only
        # A new version in CHANGELOG-UI.md is released once; every later push of it only builds.
        id: mode
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/scripts/ui_release_notes.py
          python3 .github/scripts/test_ui_release_notes.py
          version=$(python3 "$notes" latest CHANGELOG-UI.md)
          code=$(python3 "$notes" code "$version")
          echo "APK_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$code" >> "$GITHUB_ENV"
          if gh release view "ui-v$version" --json tagName >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$version ($code) is already released: build only"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "$version ($code) is new: publish"
            python3 "$notes" body CHANGELOG-UI.md "$version" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: 15641748
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Prepare signing
        env:
          APK_SIGNING_BUNDLE: ${{ secrets.APK_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          bundle = json.loads(os.environ['APK_SIGNING_BUNDLE'])
          key = Path(os.environ['RUNNER_TEMP']) / 'release.p12'
          key.write_bytes(base64.b64decode(bundle['keystore'], validate=True))
          key.chmod(0o600)
          password = bundle['password']
          print('::add-mask::' + password)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'APK_KEYSTORE={key}\nAPK_KEY_PASSWORD={password}\nAPK_KEY_ALIAS=release\n')
          PY
      - name: Bridge tests (Node, no browser, no account)
        run: |
          set -o pipefail
          mkdir -p build/bridge-tests
          node --version
          node --test api-spotify/bridge-tests/gain-diagnostics.test.mjs 2>&1 | tee build/bridge-tests/gain-diagnostics.tap | tee -a "$RUNNER_TEMP/build.log"
      - name: Unit tests and signed release
        # Also after failed bridge tests: one run reports both.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest :api:test :api-spotify:test :app:assembleRelease \
            --no-daemon --console=plain -Pkotlin.incremental=false \
            -PappVersionCode="$APK_VERSION_CODE" -PappVersionName="$APK_VERSION_NAME" \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Verify and name APK
        env:
          UI_STRICT_REMOVALS: '1'
          FORK_SIGNER_SHA256: 73cf309a74b1a107a1e1cbb9453806f7b0d8e803957ecd371cb51cfed0b21e9a
        run: |
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          mkdir -p release-assets
          apk="release-assets/MySpotilol-arm64-${APK_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signers.txt"
          grep -E 'certificate (DN|SHA-256 digest)' "$RUNNER_TEMP/signers.txt"
          # The fork key and no other: an APK signed otherwise would not update the installed app.
          test "$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/signers.txt")" = 1
          grep -q "certificate SHA-256 digest: $FORK_SIGNER_SHA256" "$RUNNER_TEMP/signers.txt" || { echo "unexpected signer"; exit 1; }
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-metadata.txt"
          python3 - "$apk" <<'PY'
          import os, re, sys, zipfile
          from pathlib import Path
          data = (Path(os.environ['RUNNER_TEMP']) / 'apk-metadata.txt').read_text()
          fields = dict(re.findall(r"(\w+)='([^']*)'", next(x for x in data.splitlines() if x.startswith('package:'))))
          assert fields['name'] == 'com.project.lol.fork.ui', fields
          assert fields['versionName'] == os.environ['APK_VERSION_NAME'], fields
          assert fields['versionCode'] == os.environ['APK_VERSION_CODE'], fields
          assert "application-label:'MySpotilol'" in data, 'app label'
          assert 'application-debuggable' not in data
          assert 'REQUEST_INSTALL_PACKAGES' not in data, 'in-app installer permission present'
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = apk.namelist()
              abis = {p.split('/')[1] for p in names if p.startswith('lib/') and p.endswith('.so')}
              assert abis <= {'arm64-v8a'}, abis
              dex = b''.join(apk.read(n) for n in names if n.endswith('.dex'))
          banned = [b'org/schabi/newpipe', b'com/music/spotui/lossless', b'com/music/spotui/data/offline/OfflineDownloader', b'com/music/spotui/di/AutoBrowser',
                    b'com/google/mlkit', b'com/google/android/datatransport', b'com/google/firebase', b'io/ktor']
          found = [b.decode() for b in banned if b in dex]
          print('removed components present:', found or 'none')
          if os.environ.get('UI_STRICT_REMOVALS') == '1':
              assert not found, found
          PY
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Collect the build for review (work branches)
        if: success() && github.ref != 'refs/heads/myspoti-ui'
        run: |
          out="$RUNNER_TEMP/review"; mkdir -p "$out"
          cp release-assets/*.apk release-assets/SHA256SUMS.txt "$RUNNER_TEMP/signers.txt" "$RUNNER_TEMP/apk-metadata.txt" "$out/"
          echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT ref=$GITHUB_REF" > "$out/build-info.txt"
      - name: Upload the build (work branches)
        if: success() && github.ref != 'refs/heads/myspoti-ui'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ github.sha }}
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports (work branches)
        if: ${{ !cancelled() && github.ref != 'refs/heads/myspoti-ui' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            base/*/build/test-results/
            base/*/build/reports/tests/
            base/build/bridge-tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish release
        # From myspoti-ui only: a dispatch on a work branch with a new version builds, never publishes.
        if: steps.mode.outputs.publish == 'true' && github.ref == 'refs/heads/myspoti-ui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ui-v${APK_VERSION_NAME}" release-assets/* --target "$GITHUB_SHA" --title "MySpotilol ${APK_VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
      - name: Collect failure log
        if: failure()
        run: |
          out="$RUNNER_TEMP/ci-log"; mkdir -p "$out"
          log="$RUNNER_TEMP/build.log"; touch "$log"
          python3 - "$log" "$out" <<'PY'
          import os, re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          secret = os.environ.get('APK_KEY_PASSWORD')
          if secret: text = text.replace(secret, '[redacted]')
          lines = text.splitlines()
          keep = [l for l in lines if re.search(r'^e: |FAILED|FAILURE:|What went wrong|error:|Exception', l)]
          Path(sys.argv[2], 'errors.txt').write_text('\n'.join(keep[:800]) + '\n')
          Path(sys.argv[2], 'tail.txt').write_text('\n'.join(lines[-1500:]) + '\n')
          Path(sys.argv[2], 'run.txt').write_text(f"run={os.environ['GITHUB_RUN_NUMBER']} sha={os.environ['GITHUB_SHA']}\n")
          PY
      - name: Upload failure log (work branches)
        if: failure() && github.ref != 'refs/heads/myspoti-ui'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-log-${{ github.sha }}
          path: ${{ runner.temp }}/ci-log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish failure log
        # The ui-ci-logs branch belongs to myspoti-ui's builds; a work branch's log stays an artifact.
        if: failure() && github.ref == 'refs/heads/myspoti-ui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/ci-log"
          git init -q -b ui-ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "MySpotilol run $GITHUB_RUN_NUMBER failed"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-ci-logs
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Remove merged work branches
        # Work branches (try-*, ui-merge-*) whose commit is part of the one just built (ancestry:
        # a change made only in a merge commit counts too, which a patch comparison misses), and
        # the failure log of an earlier run: once myspoti-ui builds, they only clutter the branch
        # list. A rebased or squashed copy is not proof: such a branch stays.
        if: success() && github.ref == 'refs/heads/myspoti-ui'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --unshallow origin myspoti-ui || git fetch -q origin myspoti-ui
          git fetch -q origin '+refs/heads/try-*:refs/remotes/origin/try-*' '+refs/heads/ui-merge-*:refs/remotes/origin/ui-merge-*'
          gone=()
          # Each branch is removed only as it was checked: a push made since keeps it (lease on its SHA).
          refs=()
          for b in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/try-*' 'refs/remotes/origin/ui-merge-*'); do
            sha=$(git rev-parse "origin/$b")
            if git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then refs+=("--force-with-lease=refs/heads/$b:$sha" ":refs/heads/$b")
            else echo "$b kept: its commit is not part of this build"; fi
          done
          if logs=$(git ls-remote origin refs/heads/ui-ci-logs | cut -f1) && [ -n "$logs" ]; then refs+=("--force-with-lease=refs/heads/ui-ci-logs:$logs" ":refs/heads/ui-ci-logs"); fi
          if [ ${#refs[@]} -eq 0 ]; then echo "nothing to remove"; exit 0; fi
          echo "removing: ${refs[*]}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${refs[@]}"

  notes:
    # Every published ui-v release shows its section of CHANGELOG-UI.md (and the standard footer).
    # Titles stay as published: releases before 0.3.0 keep the name Spotilol UI.
    # After a good build of myspoti-ui only: a work branch's changelog never rewrites published texts.
    needs: build
    if: github.repository_owner == 'kvmgithub' && github.ref == 'refs/heads/myspoti-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(python3 .github/scripts/ui_release_notes.py versions CHANGELOG-UI.md); do
            tag="ui-v$version"
            sha=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null) || { echo "$tag: not published"; continue; }
            python3 .github/scripts/ui_release_notes.py body CHANGELOG-UI.md "$version" "$sha" > "$RUNNER_TEMP/body.md"
            current=$(gh release view "$tag" --json body --jq .body)
            if [ "$current" = "$(cat "$RUNNER_TEMP/body.md")" ]; then echo "$tag: up to date"; continue; fi
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/body.md"
            echo "$tag: notes updated"
          done
